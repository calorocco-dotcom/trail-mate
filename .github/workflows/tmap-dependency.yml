name: Released TMAP dependency
on:
  push:
    paths:
      - 'platformio.ini'
      - 'cmake/TrailMateTmap.cmake'
      - 'cmake/TrailMateLinuxSources.cmake'
      - 'modules/core_tmap/**'
      - 'modules/ui_map_runtime/**'
      - 'builds/esp_idf/**'
      - 'tests/tmap/**'
      - 'tests/navigation/**'
      - '.github/workflows/tmap-dependency.yml'
  pull_request:
    paths:
      - 'platformio.ini'
      - 'cmake/**'
      - 'modules/core_tmap/**'
      - 'modules/ui_map_runtime/**'
      - 'builds/esp_idf/**'
      - 'tests/tmap/**'
      - 'tests/navigation/**'
      - '.github/workflows/tmap-dependency.yml'
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S tests/tmap -B build-tmap -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - run: cmake --build build-tmap --parallel 2
      - run: ctest --test-dir build-tmap --output-on-failure
