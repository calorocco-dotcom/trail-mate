<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trail Mate · 网页维护交互预览</title>
<style>
:root{--ink:#233f36;--muted:#687b70;--line:#dce4d8;--green:#28634e;--paper:#fffef8;--bg:#f5f6ed;--yellow:#f5d786}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Segoe UI','Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbd8c7;border-radius:10px;padding:10px 17px;background:var(--paper);color:var(--ink)}button:hover{background:#e9f0e3}button:disabled{opacity:.45;cursor:default}.primary{background:var(--green);color:#fff;border-color:var(--green)}.primary:hover{background:#1f513f}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d99e34;outline-offset:3px}header{display:flex;align-items:center;gap:30px;padding:18px 30px;background:var(--paper);border-bottom:1px solid var(--line)}.brand{font-size:23px;font-weight:700;letter-spacing:-.5px;display:flex;gap:10px;align-items:center}.logo{width:36px;height:36px;border-radius:12px;background:#dfeacb;display:grid;place-items:center;color:var(--green)}nav{display:flex;gap:6px}nav button{border:0;background:none}.selected{background:#e3ecd8!important;color:#214e3c}.identity{margin-left:auto;display:flex;align-items:center;gap:12px}.identity small{display:block;color:var(--muted)}.dot{color:#32754c}.badge{display:inline-block;padding:3px 10px;background:#e6efdf;border-radius:16px;font-size:12px}.badge.warn{background:#fff0c9;color:#775318}.badge.gray{background:#e9ece5;color:#657367}.workspace{display:grid;grid-template-columns:230px 1fr;min-height:770px}aside{padding:28px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:5px}aside button{text-align:left;background:none;border:0}aside .group{color:var(--muted);font-size:12px;margin:15px 12px 5px}.aside-bottom{margin-top:auto;padding:18px 12px;color:var(--muted);font-size:12px}main{padding:30px 38px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}h1{font-size:29px;margin:0 0 4px;letter-spacing:-.6px}h2{font-size:19px;margin:0 0 15px}h3{font-size:16px;margin:0 0 8px}p{margin:5px 0 16px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:18px}.banner{background:#fff1cc;border-radius:10px;padding:12px 17px;margin-bottom:20px;color:#765321}.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:6px}label{font-size:13px}input,select,textarea{width:100%;border:1px solid #cbd8c7;border-radius:8px;padding:10px;background:#fff;color:var(--ink)}textarea{min-height:90px;resize:vertical}input[type=checkbox]{width:18px;height:18px;accent-color:var(--green)}.switch{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}.switch:last-child{border:0}.footer{display:flex;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:15px 20px;margin-top:22px}.endpoint{display:grid;grid-template-columns:1fr 110px auto;gap:12px;align-items:end}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{border:0;background:none}.list-row{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border:0}.map{background:#e9efdf;min-height:370px;border-radius:14px;position:relative;overflow:hidden;background-image:linear-gradient(#cbd8c750 1px,transparent 1px),linear-gradient(90deg,#cbd8c750 1px,transparent 1px);background-size:48px 48px}.map svg{width:100%;height:320px}.map-label{position:absolute;top:16px;left:16px;background:var(--paper);padding:6px 12px;border-radius:8px}.map-note{position:absolute;bottom:12px;left:16px;color:#657367;font-size:12px}.stats{display:flex;gap:26px;padding:15px 0}.stats strong{font-size:21px;display:block}.steps{display:flex;gap:12px;margin:20px 0}.step{flex:1;border-top:3px solid var(--green);padding-top:10px}.step.wait{border-color:#d4ddcd;color:var(--muted)}.empty{text-align:center;padding:65px 20px 55px}.empty h1{font-size:36px}.hero-mark{margin:0 auto 22px;width:82px;height:82px;background:#e0ebcd;border-radius:24px;display:grid;place-items:center;font-size:36px}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:32px auto;max-width:1000px}.features .panel{text-align:left}.overlay{position:fixed;inset:0;background:#193c3450;display:grid;place-items:center;padding:20px}.dialog{background:var(--paper);border-radius:18px;padding:30px;width:580px;max-width:100%;box-shadow:0 20px 70px #163d3430}.dialog h2{font-size:24px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.demo{padding:10px 30px;background:#e8eddf;display:flex;gap:12px;align-items:center;font-size:12px}.demo select{width:260px;font-size:12px;padding:5px}.error{color:#a34432}.mobile-label{display:none}[hidden]{display:none!important}@media(max-width:850px){header{flex-wrap:wrap;padding:14px 18px;gap:12px}.identity{margin-left:0}nav{order:3;width:100%}.workspace{grid-template-columns:1fr}aside{display:none}main{padding:22px 18px}.split,.fields,.features{grid-template-columns:1fr}.top{align-items:flex-start;flex-wrap:wrap}.endpoint{grid-template-columns:1fr 90px}.endpoint button{grid-column:1/-1}.footer{align-items:flex-start;gap:12px;flex-wrap:wrap}.empty{padding:35px 15px}.empty h1{font-size:29px}.demo{flex-wrap:wrap}.stats{gap:15px}.steps{flex-wrap:wrap}.step{min-width:110px}}
</style></head><body>
<div class="demo"><strong>交互设计预览 · 示例数据</strong><label for="scenario">查看状态</label><select id="scenario"><option value="welcome">未连接设备</option><option value="config">设备配置 · Reticulum</option><option value="cache">Geocaching · 编辑草稿</option><option value="track">轨迹 · 共享预览</option><option value="jobs">发布任务 · 等待目录确认</option><option value="disconnect">USB 断线恢复</option><option value="conflict">配置冲突</option></select><span>所有操作仅演示，不连接真实设备</span></div>
<header><div class="brand"><span class="logo">▲</span>Trail Mate</div><nav aria-label="主要功能"><button data-view="config">设备配置</button><button data-view="cache">Geocaching</button><button data-view="track">轨迹与路线</button></nav><div class="identity" id="identity"></div></header>
<div id="app"></div><div id="modal" hidden></div>
<script>
const app=document.getElementById('app'),modal=document.getElementById('modal');let view=new URLSearchParams(location.search).get('view')||'welcome';let dirty=false;
const side=(items,selected,bottom='身份保存在设备中<br>作者指纹 8e42…c719')=>`<aside>${items.map(x=>x.startsWith('#')?`<div class="group">${x.slice(1)}</div>`:`<button class="${x===selected?'selected':''}">${x}</button>`).join('')}<div class="aside-bottom">${bottom}</div></aside>`;
const field=(name,value,type='text')=>`<label class="field">${name}<input type="${type}" value="${value}"></label>`;
const map=()=>`<div class="map" aria-label="地图布局示意，不是真实地理地图"><span class="map-label">地图预览 · WGS84</span><svg viewBox="0 0 500 320" role="img" aria-label="示例轨迹与选点"><path d="M65 260 C110 240 90 178 170 188 S220 95 286 116 S355 55 425 65" fill="none" stroke="#28634e" stroke-width="5" stroke-linecap="round"/><circle cx="65" cy="260" r="10" fill="#28634e" stroke="#fffef8" stroke-width="4"/><circle cx="425" cy="65" r="10" fill="#c7923b" stroke="#fffef8" stroke-width="4"/><circle cx="286" cy="116" r="14" fill="#fffef8" stroke="#28634e" stroke-width="4"/></svg><span class="map-note">地图布局示意 · 实际产品接入地理底图</span></div>`;
function shell(body,items,selected){return `<div class="workspace">${side(items,selected)}<main>${body}</main></div>`}
function render(){document.getElementById('scenario').value=view;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('selected',b.dataset.view===view));const connected=view!=='welcome'&&view!=='disconnect';document.getElementById('identity').innerHTML=connected?`<div><span class="dot">●</span> 山野行者 · T-Deck<small>设备身份 8e42…c719 · USB 已连接</small></div><button data-action="disconnect">断开</button>`:`<span class="muted">${view==='disconnect'?'USB 已断开':'浏览无需连接设备'}</span><button class="primary" data-action="connect">连接设备</button>`;
if(view==='welcome'){app.innerHTML=`<main><section class="empty"><div class="hero-mark">▲</div><span class="badge">设备就是你的身份</span><h1>把户外记录，带到更大的屏幕</h1><p class="muted">连接 Trail Mate，管理全部配置、维护藏宝点、分享你的路线。<br>无需注册或网页登录。</p><div class="row" style="justify-content:center"><button class="primary" data-action="connect">通过 USB 连接设备</button><button data-view="cache">浏览公开藏宝点</button><button data-view="track">浏览公开轨迹</button></div><p class="small muted" style="margin-top:16px">插入 USB 数据线，点击连接，在浏览器中选择设备串口。</p></section><div class="features"><section class="panel"><h2>设备配置</h2><p class="muted">完整设置、依赖校验和配置备份。修改前后清晰可见。</p><span class="badge gray">连接设备后维护</span></section><section class="panel"><h2>Geocaching</h2><p class="muted">地图选点、编辑草稿，以设备身份发布、更新与归档。</p><span class="badge gray">公开内容随时浏览</span></section><section class="panel"><h2>轨迹与路线</h2><p class="muted">整理设备记录，以 KML 共享到 Reticulum，或下载到设备。</p><span class="badge gray">作者签名可验证</span></section></div></main>`;return}
const configSide=['#设备管理','设备与身份','无线与协议','Reticulum 网络','频道与消息','GPS 与定位','Tracker 与路线','地图','显示与电源','蓝牙与外设','备份与恢复'];
if(view==='config'||view==='conflict'){app.innerHTML=shell(`<div class="top"><div><h1>Reticulum 网络</h1><p class="muted">配置设备的连接接口与消息传播方式。</p></div><span class="badge">已读取设备配置 · 版本 42</span></div><section class="panel"><div class="row" style="justify-content:space-between"><h2>TCP 接口</h2><button data-action="add">＋ 添加接口</button></div><p class="muted small">最多 3 个接口。设备将根据网络状态选择可用连接。</p><div class="switch"><strong>接口 1 · Sydney</strong><label class="row"><input type="checkbox" checked>启用</label></div><div class="endpoint">${field('服务器地址','sydney.reticulum.au')}${field('端口','4242','number')}<button data-action="remove">移除</button></div><div class="switch" style="margin-top:15px"><strong>接口 2 · 自定义入口</strong><label class="row"><input type="checkbox" checked>启用</label></div><div class="endpoint">${field('服务器地址','node.example.org')}${field('端口','4242','number')}<button data-action="remove">移除</button></div></section><div class="split"><section class="panel"><h2>接口访问保护 · IFAC</h2><p class="muted small">启用后，连接该接口的节点需要使用相同网络名称与口令。</p>${field('网络名称','山野小队')}<label class="field" style="margin-top:12px">网络口令<input type="password" placeholder="已设置 · 留空保留现有口令"></label><button style="margin-top:12px" data-action="secret">替换口令</button></section><section class="panel"><h2>LXMF 消息传播</h2><label class="switch">启用传播节点<input type="checkbox" checked></label><label class="field" style="margin-top:12px">发送策略<select><option>自动：优先直连，必要时传播</option><option>仅直连</option><option>仅传播</option></select></label><label class="switch">自动选择传播节点<input type="checkbox" checked></label></section></div><div class="footer"><div><strong id="change-count">${dirty?'有未保存修改':'2 项示例修改'}</strong><div class="small muted">保存后重新连接相关网络接口，无需重启设备。</div></div><div class="row"><button data-action="discard">放弃修改</button><button class="primary" data-action="save">查看变更并保存</button></div></div>`,configSide,'Reticulum 网络');if(view==='conflict')showConflict();return}
if(view==='cache'){app.innerHTML=shell(`<div class="top"><div><h1>编辑藏宝点</h1><p class="muted">草稿保存在设备中，发布时由设备身份签名。</p></div><span class="badge warn">草稿 · 尚未公开</span></div><div class="split"><section><div class="panel">${field('名称','溪谷里的石桥')}<div class="fields" style="margin-top:18px">${field('纬度','30.274100')}${field('经度','120.155100')}</div><p class="small muted">也可以在地图上选择位置。坐标使用 WGS84。</p><label class="field">描述<textarea>沿溪谷步道走到石桥，在桥北侧寻找一块有苔藓的平石。请恢复原状，勿破坏植被。</textarea></label><label class="field" style="margin-top:14px">提示<textarea style="min-height:65px">桥下听水声，石边看青苔。</textarea></label><div class="fields" style="margin-top:15px"><label class="field">难度<select><option>2 / 5</option></select></label><label class="field">地形<select><option>2.5 / 5</option></select></label></div></div></section><section>${map()}<div class="panel" style="margin-top:18px"><h3>发布身份</h3><strong>山野行者</strong><p class="small muted">设备作者指纹 8e42…c719<br>发布后可以用同一身份更新或归档。</p><div class="row"><span class="badge">新建 · v1</span><span class="badge gray">目录：户外公共目录</span></div></div></section></div><div class="footer"><span class="small muted">正文 146 / 2048 字节 · 坐标与必填项已通过校验</span><div class="row"><button data-action="draft">保存草稿</button><button class="primary" data-action="publish-cache">预览并发布</button></div></div>`,['#Geocaching','浏览藏宝点','我的藏宝点','草稿','发布任务','归档记录'],'草稿');return}
if(view==='track'){app.innerHTML=shell(`<div class="top"><div><h1>山脊环线 · 共享预览</h1><p class="muted">来自设备记录。转换为 KML 后，以你的设备身份共享。</p></div><span class="badge">录制已结束</span></div><div class="split"><section>${map()}<div class="stats"><div><strong>12.6 km</strong><span class="muted small">距离</span></div><div><strong>4 h 18 m</strong><span class="muted small">记录时长</span></div><div><strong>684 m</strong><span class="muted small">累计爬升</span></div></div><section class="panel"><h3>共享文件</h3><div class="list-row"><div><strong>山脊环线.kml</strong><div class="small muted">KML · 842 KB · 8,420 个点 · 2 个轨迹段</div></div><span class="badge">校验通过</span></div><p class="small muted">保留原始轨迹记录。共享文件与作者签名一起验证。</p></section></section><section class="panel">${field('共享名称','山脊环线')}<label class="field" style="margin-top:15px">路线说明<textarea>从山脚登上山脊，途经观景台后沿东侧步道返回。雨天部分路段较滑。</textarea></label><h3 style="margin-top:20px">位置公开范围</h3><label class="row"><input type="checkbox" checked>隐藏起点与终点附近的 300 米</label><p class="small muted">仅修改共享副本，设备原始记录保持完整。</p><h3 style="margin-top:20px">发布到</h3><label class="switch">山野公共目录<input type="checkbox" checked></label><label class="switch">小队目录<input type="checkbox"></label><div class="banner" style="margin-top:18px">共享后，他人可以下载并保存 KML。以后归档会更新公开状态，无法撤回已下载副本。</div><p class="small muted">作者：山野行者 · 8e42…c719<br>文件发送通过设备 Reticulum 网络完成。</p></section></div><div class="footer"><span class="muted small">新共享 · v1 · 使用设备作者身份</span><div class="row"><button data-action="kml">下载 KML</button><button class="primary" data-action="publish-track">检查并共享</button></div></div>`,['#轨迹与路线','浏览公开路线','设备记录','我的共享','发布任务','归档记录'],'设备记录');return}
if(view==='jobs'){app.innerHTML=shell(`<div class="top"><div><h1>发布任务</h1><p class="muted">任务已保存在设备中，关闭网页后仍可继续。</p></div><button data-action="refresh">刷新状态</button></div><section class="panel"><div class="row" style="justify-content:space-between"><h2>山脊环线</h2><span class="badge warn" id="job-status">等待目录确认</span></div><p class="muted">轨迹共享 · v1 · 山野公共目录</p><div class="steps"><div class="step">✓ 设备签名<br><span class="small muted">作者身份已核对</span></div><div class="step">✓ 文件保存<br><span class="small muted">842 KB 已校验</span></div><div class="step">✓ 条目提交<br><span class="small muted">请求已发送</span></div><div class="step wait" id="last-step">○ 目录确认<br><span class="small">等待应用接受回执</span></div></div><div class="banner" id="job-banner">文件已保存，条目尚未获得目录确认。现在还不能视为公开发布成功。</div><div class="row"><button data-action="receipt">演示收到目录确认</button><button data-action="cancel">取消后续尝试</button></div></section><section class="panel"><h2>最近完成</h2><div class="list-row"><div><strong>溪谷里的石桥</strong><div class="small muted">Geocaching · v2 · 已归档 · 10:42</div></div><span class="badge">目录已确认</span></div></section>`,['#维护空间','进行中的任务','已完成','失败与冲突'],'进行中的任务');return}
if(view==='disconnect'){app.innerHTML=shell(`<div class="banner">USB 连接已断开。未保存的编辑已保留；设备已受理的发布任务可能仍在继续。</div><div class="top"><div><h1>重新连接设备</h1><p class="muted">连接同一设备身份后，恢复配置编辑并查询任务结果。</p></div></div><section class="panel"><h2>等待恢复的内容</h2><div class="list-row"><div><strong>Reticulum 配置编辑</strong><div class="small muted">2 项未保存修改 · 基于设备配置版本 42</div></div><span class="badge warn">未写入设备</span></div><div class="list-row"><div><strong>山脊环线 · v1</strong><div class="small muted">发布任务已受理 · 需要重新查询结果</div></div><span class="badge gray">结果待查询</span></div><div class="actions"><button data-view="welcome">继续浏览公开内容</button><button class="primary" data-action="reconnect">连接原设备</button></div></section><p class="muted small">预期作者指纹 8e42…c719。连接其他身份时，不会自动提交这些修改。</p>`,['#连接恢复','待恢复内容'],'待恢复内容','原设备身份 8e42…c719');}}
function dialog(content){modal.hidden=false;modal.innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true">${content}</section></div>`;modal.querySelector('button')?.focus()}
function close(){modal.hidden=true;modal.innerHTML=''}
function showConflict(){dialog(`<span class="badge warn">设备配置已变化</span><h2>先合并，再保存</h2><p class="muted">你编辑期间，设备端也修改了配置。不会覆盖设备的新值。</p><div class="list-row"><div>接口 2 端口<br><span class="small muted">读取时 4242 → 设备现在 4243</span></div><select style="width:160px"><option>保留设备：4243</option><option>使用我的：4242</option></select></div><div class="list-row"><div>网络名称<br><span class="small muted">设备未修改</span></div><span>保留我的修改</span></div><div class="actions"><button data-action="close">返回编辑</button><button class="primary" data-action="merged">合并并重新校验</button></div>`)}
document.addEventListener('input',e=>{if(app.contains(e.target)){dirty=true;const c=document.getElementById('change-count');if(c)c.textContent='有未保存修改'}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();return}const a=b.dataset.action;if(a==='connect')dialog(`<h2>连接你的 Trail Mate</h2><p>插入 USB 数据线，下一步在浏览器串口选择器中选择设备。</p><p class="muted">连接后，网页使用设备身份维护内容。无需用户名或密码。</p><div class="actions"><button data-action="close">取消</button><button class="primary" data-action="connected">演示选择设备并连接</button></div>`);if(a==='connected'||a==='reconnect'){close();view='config';render()}if(a==='disconnect'){view='disconnect';render()}if(a==='close')close();if(a==='save')dialog(`<h2>确认配置变更</h2><p class="muted">山野行者 · T-Deck · 配置版本 42</p><div class="list-row"><span>接口 2 地址</span><strong>node.example.org</strong></div><div class="list-row"><span>IFAC 网络名称</span><strong>山野小队</strong></div><p>保存后设备重新连接相关接口，无需重启。</p><div class="actions"><button data-action="close">返回编辑</button><button class="primary" data-action="saved">保存到设备</button></div>`);if(a==='saved'||a==='merged'){close();dirty=false;view='config';render();document.getElementById('change-count').textContent='已保存并生效 · 配置版本 43'}if(a==='publish-cache'||a==='publish-track')dialog(`<span class="badge">设备身份签名</span><h2>${a==='publish-track'?'确认共享山脊环线':'确认发布溪谷里的石桥'}</h2><p>作者：山野行者 · 8e42…c719</p><p class="muted">新版本 v1。设备会先保存任务，再通过 Reticulum 提交。目录确认后才显示发布成功。</p><div class="actions"><button data-action="close">继续编辑</button><button class="primary" data-action="committed">确认并提交</button></div>`);if(a==='committed'){close();view='jobs';render()}if(a==='receipt'){document.getElementById('job-status').textContent='已公开 · 目录已确认';document.getElementById('last-step').classList.remove('wait');document.getElementById('last-step').innerHTML='✓ 目录确认<br><span class="small muted">作者与版本验证通过</span>';document.getElementById('job-banner').textContent='共享已获目录接受，可在公开路线中发现。'}if(a==='discard'){dirty=false;render();document.getElementById('change-count').textContent='没有未保存修改'}if(a==='draft')dialog(`<h2>草稿已保存到设备</h2><p>重新连接同一设备后，可以继续编辑。</p><div class="actions"><button data-action="close">完成</button></div>`);if(['add','remove','secret','cancel','kml','refresh'].includes(a))dialog(`<h2>${({add:'添加 TCP 接口',remove:'移除接口',secret:'替换网络口令',cancel:'取消后续尝试',kml:'下载共享副本',refresh:'任务状态已刷新'})[a]}</h2><p>${a==='cancel'?'已经发出的请求无法撤回。取消仅停止后续尝试，仍可能收到目录确认。':'此处为交互设计预览，实际操作将使用设备协议校验并反馈结果。'}</p>${a==='add'?field('服务器地址','')+field('端口','4242','number'):a==='secret'?field('新口令','','password'):''}<div class="actions"><button data-action="close">返回</button></div>`)});
document.getElementById('scenario').addEventListener('change',e=>{close();view=e.target.value;render()});render();
</script></body></html>
