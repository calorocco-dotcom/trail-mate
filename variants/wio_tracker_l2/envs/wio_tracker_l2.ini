[env:wio_tracker_l2]
extends = arduino_base
board = wio_tracker_l2
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
build_unflags = ${arduino_base.build_unflags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${arduino_base.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DTRAIL_MATE_ENABLE_USB_CDC_TRANSPORT=1
    -DTRAIL_MATE_USB_HOSTLINK_AUTOSTART=1
    -Imodules/core_hostlink/include
    -DARDUINO_LOOP_STACK_SIZE=12288
    -DCONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=1
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=4
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=185
    -DARDUINO_WIO_TRACKER_L2
    -DTRAILMATE_TARGET_ID=\"wio_tracker_l2\"
    -DTRAIL_MATE_LORA_TX_POWER_MAX_DBM=20
    -DTRAIL_MATE_ENABLE_SSTV=0
    -DTRAIL_MATE_SDFAT_SDMMC=1
    -DUSE_BLOCK_DEVICE_INTERFACE=1
    -DUI_SHARED_TOUCH_IME_ENABLED=1
    -DSCREEN_WIDTH=320
    -DSCREEN_HEIGHT=240
    -DUSING_INPUT_DEV_TOUCHPAD
    -Iboards/wio_tracker_l2/include
build_src_filter =
    +<*>
    -<board/LilyGoKeyboard.cpp>
lib_deps =
    ${arduino_base.lib_deps}
    file://third_party/yxml
    lovyan03/LovyanGFX @ 1.2.28
    https://github.com/pschatzmann/arduino-audio-driver/archive/refs/tags/v0.3.1.zip
lib_ignore =
    gat562_mesh_evb_pro
    boards_gat562_mesh_evb_pro
    trailmate-nrf52-node-app-shell
    platform_nrf52_arduino_common
    SD
    boards_tdeck
    boards_tdeck_pro
    boards_tlora_pager
    boards_twatchs3
    boards_tab5
    boards_t_display_p4
    boards_t_echo_lite
